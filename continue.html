<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Continue with Alislamiah AI</title>
<link rel="icon" href="icon.png">

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:22px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top,#153c70,transparent 45%),#050b16;
  color:#edf5ff;font-family:Arial,sans-serif
}
.container{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:25px}
.brand img{width:65px;height:65px;object-fit:contain;border-radius:17px}
.brand h1{font-size:23px;margin:12px 0 6px}
.brand p{font-size:13px;color:#91a9c7}
.panel{
  background:#0c192c;border:1px solid #203a5c;
  border-radius:22px;padding:24px;
  box-shadow:0 25px 80px #0008
}
.step{display:none}
.step.active{display:block}
h2{font-size:21px;margin:0 0 10px}
.desc{font-size:13px;color:#91a9c7;line-height:1.6;margin:0 0 22px}
button{
  width:100%;padding:14px;border:0;border-radius:11px;
  background:linear-gradient(110deg,#1676e8,#35a2ff);
  color:white;font-weight:bold;cursor:pointer;margin-top:9px
}
button.secondary{
  background:#142943;border:1px solid #294362
}
.account{
  padding:15px;border:1px solid #294362;
  background:#0a1729;border-radius:13px;
  margin:10px 0;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:border-color .2s
}
.account:hover{border-color:#3995ff}
.avatar{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;background:#183d68;color:#8ec5ff;
  font-weight:bold;flex-shrink:0;font-size:16px;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.account-info{min-width:0;flex:1}
.account-info strong{display:block;font-size:14px}
.account-info small{
  display:block;color:#91a9c7;margin-top:5px;
  overflow-wrap:anywhere;font-size:12px
}
.status{
  font-size:13px;line-height:1.5;margin:0 0 14px;
  color:#ffb8c4;min-height:18px
}
.status.good{color:#9df0bd}
.footer{text-align:center;color:#66809f;font-size:11px;margin-top:18px}
.success-icon{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#1676e8,#35a2ff);
  display:grid;place-items:center;margin:0 auto 20px;
  font-size:34px;color:white
}
.hidden{display:none !important}
</style>
</head>

<body>
<div class="container">

  <div class="brand">
    <img src="icon.png" onerror="this.style.display='none'">
    <h1>Alislamiah AI</h1>
    <p>Secure account connection</p>
  </div>

  <div class="panel">

    <div id="status" class="status"></div>

    <!-- Select Account -->
    <section class="step active" id="accountsStep">
      <h2>Select your account</h2>
      <p class="desc">Choose an account to continue.</p>

      <div id="loading" class="desc">Checking available accounts...</div>

      <div id="accountsList"></div>

      <div id="noAccounts" class="hidden">
        <p class="desc">No active Alislamiah AI sessions found.</p>
      </div>
    </section>

    <!-- Success -->
    <section class="step" id="returnStep">
      <div class="success-icon">✓</div>
      <h2 style="text-align:center">Successful return to the app</h2>
      <p class="desc" style="text-align:center">Your account is ready. You can return to the application.</p>
      <button id="returnBtn">Return</button>
    </section>

  </div>

  <div class="footer">Alislamiah AI · Secure Authentication</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrv1ky0Br5nLb68uvdXE3o6QdzTKpIU4g",
    authDomain: "alislamiah-ai-34202.firebaseapp.com",
    projectId: "alislamiah-ai-34202",
    storageBucket: "alislamiah-ai-34202.firebasestorage.app",
    messagingSenderId: "683051452829",
    appId: "1:683051452829:web:e96e40422c7f31e563c774",
    measurementId: "G-LFQLND010S"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // نفس المفتاح المستخدم في MGA-Code-Editor
  const ACCOUNTS_KEY = "alislamiah_saved_accounts";
  const CURRENT_USER_KEY = "alislamiah_current_user";

  const params = new URLSearchParams(location.search);
  const returnURL = params.get("return") || params.get("redirect") || "";

  function $(id){ return document.getElementById(id); }

  function show(id) {
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  function getSavedAccounts() {
    try {
      return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveAccountToLocal(user) {
    let accounts = getSavedAccounts();
    const idx = accounts.findIndex(a => a.uid === user.uid);
    const data = {
      uid: user.uid,
      name: user.displayName || (user.email ? user.email.split("@")[0] : "User"),
      email: user.email || "",
      photoURL: user.photoURL || ""
    };
    if (idx >= 0) accounts[idx] = data;
    else accounts.push(data);
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
  }

  function setCurrentUser(account) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
      id: account.uid,
      name: account.name || account.displayName || "User",
      email: account.email || ""
    }));
  }

  function escapeHTML(s) {
    return String(s || "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])
    );
  }

  function renderAccounts() {
    const accounts = getSavedAccounts();
    const list = $("accountsList");
    const noAccounts = $("noAccounts");
    const loading = $("loading");

    loading.classList.add("hidden");
    list.innerHTML = "";

    if (accounts.length === 0) {
      noAccounts.classList.remove("hidden");
      return;
    }

    noAccounts.classList.add("hidden");

    accounts.forEach(acc => {
      const item = document.createElement("div");
      item.className = "account";

      const avatar = document.createElement("div");
      avatar.className = "avatar";

      if (acc.photoURL) {
        avatar.innerHTML = `<img src="${escapeHTML(acc.photoURL)}" alt="">`;
      } else {
        avatar.textContent = (acc.name || acc.email || "?").charAt(0).toUpperCase();
      }

      const info = document.createElement("div");
      info.className = "account-info";
      info.innerHTML = `
        <strong>Continue as ${escapeHTML(acc.name || "User")}</strong>
        <small>${escapeHTML(acc.email || "")}</small>
      `;

      item.append(avatar, info);
      item.onclick = () => selectAccount(acc);
      list.appendChild(item);
    });
  }

  function selectAccount(account) {
    // حفظ الحساب الحالي
    setCurrentUser(account);

    // الانتقال لشاشة النجاح
    show("returnStep");
  }

  function returnToApp() {
    // 1. إذا جاء رابط return أو redirect في الرابط → ارجع إليه
    if (returnURL) {
      try {
        const url = new URL(returnURL, location.origin);
        if (url.protocol === "https:" || url.protocol === "http:") {
          location.href = url.href;
          return;
        }
      } catch (e) {}
    }

    // 2. إذا جاء من موقع آخر (referrer) → ارجع إليه
    if (document.referrer) {
      try {
        const ref = new URL(document.referrer);
        if (ref.origin !== location.origin) {
          location.href = document.referrer;
          return;
        }
      } catch (e) {}
    }

    // 3. محاولة الرجوع في التاريخ
    if (history.length > 1) {
      history.back();
      return;
    }

    // 4. آخر حل: إغلاق النافذة إن أمكن
    try {
      window.close();
    } catch (e) {}
  }

  $("returnBtn").addEventListener("click", returnToApp);

  // تهيئة
  await setPersistence(auth, browserLocalPersistence);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      saveAccountToLocal(user);
    }
    renderAccounts();
    show("accountsStep");
  });
</script>
</body>
</html>
