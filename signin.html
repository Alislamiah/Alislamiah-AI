<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <title>تسجيل الدخول — متصفح الإسلامية الذكي</title>
  <style>
    :root {
      --bg: #0a1628;
      --card: rgba(15, 30, 55, 0.55);
      --text: #f0f4ff;
      --muted: #8fa3c0;
      --blue: #2b7fff;
      --blue-dark: #1a5fd4;
      --input-bg: rgba(20, 35, 60, 0.7);
      --border: rgba(120, 150, 190, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #132a4a 0%, #0a1628 55%, #06101c 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 18px;
      background: linear-gradient(145deg, #3b9bff, #1a6ef0);
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      box-shadow: 0 0 28px rgba(43, 127, 255, 0.55);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .field {
      text-align: right;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input::placeholder {
      color: #6b7f9c;
    }

    .field input:focus {
      border-color: var(--blue);
    }

    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #1a6ef0, #3b9bff);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled, .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(18, 28, 48, 0.85);
      color: #e8eef8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .btn-google:hover {
      background: rgba(28, 42, 68, 0.95);
    }

    .message {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(80, 20, 30, 0.7);
      border: 1px solid #7a3040;
      color: #ffb0b8;
    }

    .message.success {
      background: rgba(15, 50, 40, 0.7);
      border: 1px solid #2a6a55;
      color: #8cf0c3;
    }

    /* النافذة المنبثقة (Modal) لحفظ كلمة المرور */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 10, 20, 0.8);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #0f1e37;
      border: 1px solid var(--border);
      padding: 28px 24px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
    }

    .modal-content p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: opacity 0.2s;
    }

    .btn-save {
      background: linear-gradient(90deg, #1a6ef0, #3b9bff);
      color: white;
    }

    .btn-skip {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">AI</div>
    <h1>تسجيل الدخول</h1>
    <p class="subtitle">مرحباً بك مجدداً في متصفح الإسلامية الذكي</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">دخول</button>
    </form>

    <div class="divider"><span>أو</span></div>

    <button type="button" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.17 21.36 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.17 2.64 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      المتابعة باستخدام Google
    </button>

    <p style="margin-top:18px;font-size:13px;color:var(--muted)">
      ليس لديك حساب؟
      <a href="signup.html" style="color:#5ba3ff;font-weight:600;text-decoration:underline;padding:0 4px">إنشاء حساب</a>
    </p>

    <div id="msg" class="message"></div>
  </div>

  <!-- Modal حفظ كلمة المرور -->
  <div id="saveModal" class="modal">
    <div class="modal-content">
      <h3>حفظ بيانات الدخول</h3>
      <p>تم تسجيل الدخول بنجاح! هل تريد الانتقال لصفحة حفظ كلمات المرور؟</p>
      <div class="modal-actions">
        <button id="saveYesBtn" class="modal-btn btn-save">حفظ البيانات</button>
        <button id="saveNoBtn" class="modal-btn btn-skip">تخطي للرئيسية</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrv1ky0Br5nLb68uvdXE3o6QdzTKpIU4g",
      authDomain: "alislamiah-ai-34202.firebaseapp.com",
      projectId: "alislamiah-ai-34202",
      storageBucket: "alislamiah-ai-34202.firebasestorage.app",
      messagingSenderId: "683051452829",
      appId: "1:683051452829:web:e96e40422c7f31e563c774",
      measurementId: "G-LFQLND010S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let tempUserData = null;

    function showMsg(text, type) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = "message show " + type;
    }

    function clearMsg() {
      const el = document.getElementById("msg");
      el.className = "message";
      el.textContent = "";
    }

    function openSaveModal(userData) {
      tempUserData = userData;
      document.getElementById("saveModal").classList.add("show");
    }

    // زر "حفظ البيانات" -> يوجه لـ save.passwords.html
    document.getElementById("saveYesBtn").addEventListener("click", () => {
      if (tempUserData) {
        localStorage.setItem("saved_auth_user", JSON.stringify(tempUserData));
      }
      window.location.href = "save.passwords.html";
    });

    // زر "تخطي للرئيسية" -> يوجه لـ index.html
    document.getElementById("saveNoBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // تسجيل الدخول بالبريد
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      if (!email || !password) {
        showMsg("أدخل البريد وكلمة المرور.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "جاري الدخول...";

      try {
        const res = await signInWithEmailAndPassword(auth, email, password);
        showMsg("تم تسجيل الدخول بنجاح.", "success");
        
        // إظهار النافذة المنبثقة للتحكم في التوجيه وعدم الذهاب للرئيسية مباشرة
        openSaveModal({
          uid: res.user.uid,
          email: res.user.email,
          pass: password,
          provider: "password"
        });

      } catch (err) {
        let msg = "فشل تسجيل الدخول.";
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          msg = "البريد أو كلمة المرور غير صحيحة.";
        } else if (err.code === "auth/invalid-email") {
          msg = "صيغة البريد غير صحيحة.";
        } else if (err.code === "auth/too-many-requests") {
          msg = "محاولات كثيرة. حاول لاحقاً.";
        } else {
          msg = err.message || msg;
        }
        showMsg(msg, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
      }
    });

    // تسجيل الدخول بـ Google
    document.getElementById("googleBtn").addEventListener("click", async () => {
      clearMsg();
      const btn = document.getElementById("googleBtn");
      btn.disabled = true;

      try {
        const res = await signInWithPopup(auth, googleProvider);
        showMsg("تم تسجيل الدخول عبر Google بنجاح.", "success");

        // إظهار النافذة المنبثقة للتحكم في التوجيه
        openSaveModal({
          uid: res.user.uid,
          email: res.user.email,
          name: res.user.displayName,
          provider: "google"
        });

      } catch (err) {
        let msg = "فشل التسجيل عبر Google.";
        if (err.code === "auth/popup-closed-by-user") {
          msg = "تم إغلاق النافذة.";
        } else if (err.code === "auth/popup-blocked") {
          msg = "المتصفح منع النافذة المنبثقة.";
        } else {
          msg = err.message || msg;
        }
        showMsg(msg, "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
