<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlIslamiah AI - تسجيل الدخول</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --input-bg: #334155;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: var(--card-bg);
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .login-card h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #2563eb;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #64748b;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    /* زر Google */
    .google-btn {
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s;
    }

    .google-btn:hover {
      background-color: #f8fafc;
    }

    /* النافذة المنبثقة (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      border: 1px solid var(--border-color);
    }

    .modal-content h3 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .modal-content p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #cbd5e1;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save { background-color: #22c55e; color: white; }
    .btn-skip { background-color: #64748b; color: white; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>AlIslamiah AI</h2>
    
    <!-- نموذج الدخول بالبريد/الهاتف وكلمة المرور -->
    <form id="loginForm" onsubmit="handleEmailLogin(event)">
      <div class="form-group">
        <label>البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" id="userInput" placeholder="example@mail.com أو 0600000000" required>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">تسجيل الدخول</button>
    </form>

    <div class="divider">
      <span>أو</span>
    </div>

    <!-- زر Google المباشر -->
    <button onclick="loginWithGoogle()" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.17 21.36 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.17 2.64 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      المتابعة باستخدام Google
    </button>
  </div>

  <!-- النافذة المنبثقة (Modal) لحفظ كلمة المرور -->
  <div id="saveModal" class="modal">
    <div class="modal-content">
      <h3>نجح تسجيل الدخول!</h3>
      <p>هل تريد حفظ بيانات الدخول لهذه الجلسة؟</p>
      <div class="modal-actions">
        <button onclick="redirectWithSave(true)" class="modal-btn btn-save">حفظ وتوجيه</button>
        <button onclick="redirectWithSave(false)" class="modal-btn btn-skip">تخطي</button>
      </div>
    </div>
  </div>

  <!-- Firebase & Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "alislamiah-ai-34202.firebaseapp.com",
      projectId: "alislamiah-ai-34202",
      storageBucket: "alislamiah-ai-34202.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    window.tempUserData = null;

    // 1. الدخول بالبريد/الهاتف
    window.handleEmailLogin = async function(e) {
      e.preventDefault();
      const userVal = document.getElementById("userInput").value;
      const passVal = document.getElementById("passwordInput").value;

      try {
        // إذا كان بريد إلكتروني نستخدم Firebase Auth
        if(userVal.includes("@")) {
          const res = await signInWithEmailAndPassword(auth, userVal, passVal);
          window.tempUserData = { email: res.user.email, pass: passVal };
        } else {
          // التعامل مع رقم الهاتف كاسم مستخدم يدوي
          window.tempUserData = { phone: userVal, pass: passVal };
        }
        
        // إظهار المودال
        document.getElementById("saveModal").classList.add("show");
      } catch (err) {
        alert("خطأ في تسجيل الدخول: " + err.message);
      }
    };

    // 2. الدخول عبر Google
    window.loginWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        window.tempUserData = { 
          email: result.user.email, 
          name: result.user.displayName,
          provider: "Google" 
        };
        
        document.getElementById("saveModal").classList.add("show");
      } catch (err) {
        alert("فشل التسجيل عبر Google: " + err.message);
      }
    };

    // 3. التحكم في التوجيه وسلوك الـ Modal
    window.redirectWithSave = function(shouldSave) {
      if (shouldSave) {
        // حفظ في save.passwords أو localStorage ثم التوجيه
        localStorage.setItem("saved_user", JSON.stringify(window.tempUserData));
        window.location.href = "save.passwords.html";
      } else {
        window.location.href = "index.html";
      }
    };
  </script>

</body>
</html>
