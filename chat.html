<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;position:relative;}
.header-title{font-size:23px;font-weight:bold;}
.back-btn{position:absolute;right:12px;background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 14px;border-radius:20px;font-size:15px;font-weight:bold;cursor:pointer;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}
.ai a{color:#0066cc;text-decoration:underline;font-weight:bold;}
.ai img,.ai video,.user img,.user video{max-width:100%;border-radius:12px;margin-top:8px;display:block;}
.ai audio,.user audio{width:100%;margin-top:8px;}
.typing{opacity:0.7;font-style:italic;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{padding:10px 12px 14px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;position:relative;}
.input-box{width:100%;max-width:800px;margin:0 auto;min-height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px 6px;gap:4px;}
.plus-btn,.mic-btn{width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;background:transparent;color:#333;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.plus-btn:hover,.mic-btn:hover{background:#f3f4f6;}
.mic-btn.recording{background:#fee2e2;color:#dc2626;}
textarea{flex:1;min-height:42px;max-height:90px;resize:none;border:none;outline:none;background:transparent;padding:10px 8px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
.send:disabled{opacity:0.5;cursor:not-allowed;}

.tools-popup{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:90%;max-width:340px;background:#111827;border:1px solid #1f2937;border-radius:16px;padding:8px;display:none;z-index:100;box-shadow:0 16px 40px rgba(0,0,0,.5);}
.tools-popup.open{display:block;}
.tools-popup button{width:100%;text-align:right;padding:12px 14px;border:none;border-radius:12px;background:transparent;color:#e5e7eb;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.tools-popup button:hover{background:#1f2937;}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.history.back()">⬅️ العودة</button>
  <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <h1>Alislamiah-AI</h1>
    <p>كيف يمكنني مساعدتك؟</p>
  </div>
</div>

<div class="input-area">
  <div class="tools-popup" id="toolsPopup">
    <button onclick="triggerUpload('image');closeTools()"><span>🖼️</span> رفع صورة</button>
    <button onclick="triggerUpload('video');closeTools()"><span>🎥</span> رفع فيديو</button>
    <button onclick="triggerUpload('file');closeTools()"><span>📎</span> رفع ملف</button>
    <button onclick="triggerUpload('audio');closeTools()"><span>🎵</span> رفع صوت</button>
  </div>
  <div class="input-box">
    <button class="plus-btn" id="plusBtn" onclick="toggleTools()" title="أدوات">+</button>
    <textarea id="message" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="محادثة صوتية">🎙️</button>
    <button class="send" id="sendBtn">إرسال</button>
  </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip,.rar">

<script src="media.html"></script>

<script>
// ===== مفتاح Gemini =====
const GEMINI_API_KEY = "AQ.Ab8RN6IeFUlFbso5M8ry5FbzGnSBCf0w2wcSnHK6wZZuNIRJ6Q";
const GEMINI_MODELS = [
  "gemini-2.5-flash","gemini-3.8-flash","gemini-3.0-flash","gemini-2.5-pro",
  "gemini-flash-latest","gemini-2.0-flash","gemini-1.5-flash","gemini-1.5-flash-latest","gemini-pro"
];

const chatKnowledge = [
  { roots: ["كيف يمكنك مساعدتك", "مرحباً", "السلام عليكم", "أهلاً", "مرحبا"], reply: "وعليكم السلام ورحمة الله وبركاته! أنا مساعدك الذكي Alislamiah-AI، جاهز لإجابتك عن الأسئلة والأحكام الفقهية الشرعية. يمكنك أيضاً رفع صور وفيديوهات وملفات أو التحدث بالصوت." },
  { roots: ["إلى اللقاء", "مع السلامة", "سلام", "باي", "وداعاً"], reply: "في أمان الله ورعايته! أتمنى أن أكون قد أفدتك، وتسعدني عودتك دائماً." },
  { roots: ["أحكام سجدتي السهو", "سجود السهو"], reply: "سجود السهو مشروع لجبر ما حصل في الصلاة من زيادة أو نقص، ويكون قبل السلام أو بعده." },
  { roots: ["أحكام سجود التلاوة", "سجدة القرآن"], reply: "يسجد القارئ والمستمع سجود التلاوة عند مروره بآية سجود، ويكبر لها دون تشهد أو تسليم." },
  { roots: ["أحكام سجود الشكر", "سجدة الشكر لله"], reply: "يسن سجود الشكر لله تعالى عند تجدد نعمة عظيمة أو اندفاع نقمة، وهو سجدة واحدة." },
  { roots: ["أحكام قصر الصلاة", "رخصة السفر", "السفر الصائم"], reply: "يشرع للمسافر قصر الصلاة الرباعية إلى ركعتين، وجمع الظهر والعصر أو المغرب والعشاء، ويجوز له الفطر في رمضان وقضاء عدد من أيام أخر." },
  { roots: ["أحكام صلاة الجمعة", "التخلف عن الجمعة"], reply: "تجب صلاة الجمعة على كل مسلم بالغ عاقل مقيم، ومن تركها ثلاث جمع طبع الله على قلبه." },
  { roots: ["أحكام الصيام"], reply: "الصيام ركن من أركان الإسلام، وشروطه الإسلام والبلوغ والعقل والإقامة والصحة." },
  { roots: ["أحكام المفطرات"], reply: "يبطل الصيام بالأكل والشرب عمداً والجماع والاستقاءة العمد ونزول دم الحيض والنفاس." },
  { roots: ["أحكام الحج"], reply: "الحج فرض على كل مسلم مستطيع في عمره مرة، وأركانه الإحرام والطواف والسعي والوقوف بعرفة." },
  { roots: ["أحكام العمرة"], reply: "العمرة سنة مؤكدة أو واجبة في العمر مرة، وتكفر ما بينها وبين العمرة الأخرى لمن أتمها." },
  { roots: ["أحكام الزكاة", "أحكام زكاة المال"], reply: "تجب زكاة المال إذا بلغ النصاب الشرعي وحال عليه الحول القمري، وتقوم عروض التجارة بسعر السوق وقت الحول." },
  { roots: ["أحكام النكاح"], reply: "يقوم النكاح الصحيح على الإيجاب والقبول، ووجود الولي، والشهود، وخلو الزوجين من الموانع." },
  { roots: ["أحكام الطلاق"], reply: "الخلع فرقة بعوض تأخذه الزوجة لتباري به زوجها، والطلاق بائن والعدة تحصين للرحم." },
  { roots: ["أحكام التوبة"], reply: "التوبة تجب ما قبلها، وشرائطها: الإقلاع عن الذنب، والندم، والعزم على عدم العودة." },
  { roots: ["أحكام الذكر"], reply: "ذكر الله يجلو القلوب، والاستغفار يفتح الأقفال، والدعاء مخ العبادة وأعظم أسباب الإجابة." },
  { roots: ["أحكام الصبر"], reply: "الصبر الجميل هو الذي لا شكوى فيه لغير الله، والرضا التام بالقدر المقدر بحكمة." },
  { roots: ["أحكام الرضا"], reply: "عجباً لأمر المؤمن إن أمره كله خير، إن أصابته سرّاء شكر فكان خيراً له." }
];

const chat = document.getElementById('chat');
const messageInput = document.getElementById('message');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
const fileInput = document.getElementById('fileInput');
const micBtn = document.getElementById('micBtn');
let recognition = null;
let lastVoiceInput = false;

function addMessage(text, sender, isHtml) {
  if (welcome) welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  if (isHtml) div.innerHTML = text;
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function findLocalReply(userText) {
  const lower = userText.trim().toLowerCase();
  const external = (typeof window.mediaDatabase !== 'undefined') ? window.mediaDatabase : [];
  const all = [...chatKnowledge, ...external];
  for (let item of all) {
    for (let root of item.roots) {
      if (lower.includes(root.toLowerCase())) return item.reply;
    }
  }
  return null;
}

async function askGemini(userText) {
  const systemPrompt = "أنت مساعد ذكي إسلامي اسمك Alislamiah-AI. أجب بالعربية الفصحى بوضوح. إذا كان السؤال شرعياً فاعتمد على الكتاب والسنة. كن مهذباً ومفيداً.";
  const body = {
    contents: [{ role: "user", parts: [{ text: systemPrompt + "\n\nسؤال المستخدم: " + userText }] }],
    generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
  };
  let lastError = null;
  for (const model of GEMINI_MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) {
        const errText = await res.text().catch(() => "");
        lastError = new Error(model + " " + res.status + ": " + errText.slice(0, 150));
        if (res.status === 404) continue;
        continue;
      }
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) return text.trim();
    } catch (e) { lastError = e; continue; }
  }
  throw lastError || new Error("تعذر الاتصال بـ Gemini");
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/<[^>]*>/g, '').slice(0, 400);
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'ar-SA';
  window.speechSynthesis.speak(utter);
}

function toggleTools() {
  document.getElementById('toolsPopup').classList.toggle('open');
}
function closeTools() {
  document.getElementById('toolsPopup').classList.remove('open');
}
document.addEventListener('click', (e) => {
  const pop = document.getElementById('toolsPopup');
  const plus = document.getElementById('plusBtn');
  if (pop && !pop.contains(e.target) && e.target !== plus) pop.classList.remove('open');
});

function triggerUpload(type) {
  if (!fileInput) return;
  if (type === 'image') fileInput.accept = 'image/*';
  else if (type === 'video') fileInput.accept = 'video/*';
  else if (type === 'audio') fileInput.accept = 'audio/*';
  else fileInput.accept = '.pdf,.doc,.docx,.txt,.zip,.rar,image/*,video/*,audio/*,*/*';
  fileInput.setAttribute('data-type', type);
  fileInput.click();
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

if (fileInput) fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 15 * 1024 * 1024) {
    alert('الملف كبير (الحد 15MB)');
    e.target.value = '';
    return;
  }
  try {
    const base64 = await fileToBase64(file);
    if (file.type.startsWith('image/')) {
      addMessage(`<div>🖼️ ${file.name}</div><img src="${base64}" alt="">`, 'user', true);
      addMessage('✅ تم رفع الصورة بنجاح.', 'ai');
    } else if (file.type.startsWith('video/')) {
      addMessage(`<div>🎥 ${file.name}</div><video src="${base64}" controls></video>`, 'user', true);
      addMessage('✅ تم رفع الفيديو بنجاح.', 'ai');
    } else if (file.type.startsWith('audio/')) {
      addMessage(`<div>🎵 ${file.name}</div><audio src="${base64}" controls></audio>`, 'user', true);
      addMessage('✅ تم رفع الملف الصوتي.', 'ai');
    } else {
      const kb = Math.round(file.size / 1024);
      addMessage(`<div>📎 ${file.name}</div><div style="font-size:12px;opacity:.7">النوع: ${file.type || 'ملف'} — ${kb} KB</div>`, 'user', true);
      addMessage('✅ تم رفع الملف: ' + file.name, 'ai');
    }
  } catch (err) {
    alert('خطأ في الرفع');
  }
  e.target.value = '';
});

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('المتصفح لا يدعم التعرف على الصوت');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (recognition) {
    recognition.stop();
    recognition = null;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙️';
    return;
  }
  recognition = new SR();
  recognition.lang = 'ar-SA';
  recognition.interimResults = false;
  recognition.start();
  lastVoiceInput = true;
  micBtn.classList.add('recording');
  micBtn.textContent = '🔴';
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    messageInput.value = transcript;
    setTimeout(() => handleSend(), 300);
  };
  recognition.onend = () => {
    recognition = null;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙️';
  };
  recognition.onerror = () => {
    recognition = null;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙️';
  };
}

async function handleSend() {
  const text = messageInput.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  addMessage(text, 'user');
  messageInput.value = '';

  const local = findLocalReply(text);
  if (local) {
    setTimeout(() => {
      addMessage(local, 'ai');
      if (lastVoiceInput) { speakText(local); lastVoiceInput = false; }
      sendBtn.disabled = false;
    }, 300);
    return;
  }

  const typingDiv = addMessage('جاري التفكير...', 'ai');
  typingDiv.classList.add('typing');
  try {
    const reply = await askGemini(text);
    typingDiv.classList.remove('typing');
    typingDiv.textContent = reply;
    if (lastVoiceInput) { speakText(reply); lastVoiceInput = false; }
  } catch (err) {
    typingDiv.classList.remove('typing');
    typingDiv.textContent = 'تعذر الاتصال حالياً. حاول مرة أخرى.\n(' + (err.message || '') + ')';
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener('click', handleSend);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
/* =========================================
   نظام اللغة الموحد - Alislamiah
========================================= */

function getLanguage() {
    return localStorage.getItem("appLanguage") || "en";
}

function applyLanguage(lang) {
    // ضبط اتجاه الصفحة
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";

    // يمكنك هنا إضافة أي تعديلات خاصة بكل صفحة
    // مثال: تغيير نصوص معينة
}

// عند فتح الصفحة
document.addEventListener("DOMContentLoaded", function () {
    applyLanguage(getLanguage());
});

// عند تغيير اللغة من صفحة الإعدادات
window.addEventListener("storage", function (e) {
    if (e.key === "appLanguage") {
        applyLanguage(e.newValue || "en");
    }
});
</script>
</body>
</html>
