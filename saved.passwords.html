<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمات المرور المحفوظة - Alislamiah AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0b1020;color:#fff;min-height:100vh;padding:20px 15px}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,119,255,.22),transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,195,255,.12),transparent 40%),#0b1020;z-index:0}
.container{position:relative;z-index:1;max-width:620px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
h1{font-size:22px;font-weight:700}
.header-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.btn-back{background:rgba(255,255,255,.1);color:#ccc}
.btn-import{background:rgba(0,195,255,.2);color:#00c3ff;border:1px solid rgba(0,195,255,.4)}
.btn-logout{background:rgba(255,80,80,.2);color:#ff6b6b;border:1px solid rgba(255,80,80,.4)}
.note{background:rgba(0,195,255,.08);border:1px solid rgba(0,195,255,.2);border-radius:14px;padding:13px 16px;margin-bottom:20px;font-size:13.5px;color:#a0d4ff;line-height:1.6}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card h3{font-size:16px;margin-bottom:4px}
.card .email{font-size:13px;color:#9fb8e0}
.card .site{font-size:12px;color:#facc15;margin-top:4px;font-weight:600}
.password-row{display:flex;align-items:center;gap:8px;margin-top:12px;background:rgba(0,0,0,.28);padding:10px 12px;border-radius:12px}
.password-row span{flex:1;font-family:monospace;letter-spacing:1px;font-size:14px;word-break:break-all}
.btn-show{background:rgba(0,195,255,.15);color:#00c3ff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-copy{background:rgba(255,255,255,.08);color:#ccc;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-delete{background:rgba(255,80,80,.15);color:#ff6b6b;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.empty{text-align:center;padding:55px 20px;color:#6a82a8}
.empty-icon{font-size:42px;margin-bottom:12px}
.actions-bottom{text-align:center;margin-top:20px}
.btn-clear{background:rgba(255,80,80,.18);color:#ff6b6b;border:1px solid rgba(255,80,80,.35);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}

/* نافذة الاستيراد */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:10;display:none;align-items:center;justify-content:center;padding:15px}
.modal-overlay.active{display:flex}
.modal{background:#111827;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px;width:100%;max-width:420px;box-shadow:0 10px 25px rgba(0,0,0,.5)}
.modal h2{font-size:18px;margin-bottom:15px;color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#9fb8e0;margin-bottom:6px}
.form-group input{width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none}
.form-group input:focus{border-color:#00c3ff}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn-save-import{background:#00c3ff;color:#000}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <header>
    <h1>كلمات المرور المحفوظة</h1>
    <div class="header-btns">
      <button class="btn btn-import" onclick="openImportModal()">📥 import password</button>
      <button class="btn btn-logout" onclick="logoutAndDeleteAccount()">🚪 حذف الحساب / تسجيل الخروج</button>
      <button class="btn btn-back" onclick="window.location.href='index.html'">العودة</button>
    </div>
  </header>

  <div class="note">
    🔒 تظهر هنا كلمات المرور وحسابات تسجيل الدخول وإنشاء الحساب التي تم حفظها تلقائياً من تطبيقات شبكة الإسلامية (مثل Gemalot).
  </div>

  <div id="list"></div>
</div>

<!-- نافذة استيراد كلمة مرور -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>إضافة / استيراد كلمة مرور</h2>
    <form id="importForm" onsubmit="handleImportSubmit(event)">
      <div class="form-group">
        <label>اسم المستخدم / الاسم:</label>
        <input type="text" id="impName" placeholder="مثال: محمد" required>
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="impEmail" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="text" id="impPassword" placeholder="أدخل كلمة المرور" required>
      </div>
      <div class="form-group">
        <label>الموقع / الخدمة:</label>
        <input type="text" id="impSite" placeholder="Alislamiah AI" value="Gemalot">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-back" onclick="closeImportModal()">إلغاء</button>
        <button type="submit" class="btn btn-save-import">حفظ</button>
      </div>
    </form>
  </div>
</div>

<script>
  const STORAGE_KEY = "alislamiah_saved_passwords";

  function getSaved() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function setSaved(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  // دالة مساعدة للاستيراد اليدوي
  function openImportModal() {
    document.getElementById("importModal").classList.add("active");
  }

  function closeImportModal() {
    document.getElementById("importModal").classList.remove("active");
    document.getElementById("importForm").reset();
  }

  function handleImportSubmit(e) {
    e.preventDefault();
    const name = document.getElementById("impName").value;
    const email = document.getElementById("impEmail").value;
    const password = document.getElementById("impPassword").value;
    const site = document.getElementById("impSite").value;

    let list = getSaved();
    list.unshift({
      id: Date.now(),
      name,
      email,
      password,
      site,
      savedAt: new Date().toISOString()
    });
    setSaved(list);

    closeImportModal();
    render();
  }

  // زر تسجيل الخروج وحذف بيانات الجلسة ومدير كلمات المرور
  function logoutAndDeleteAccount() {
    if (!confirm("⚠️ هل أنت متأكد من رغبتك في تسجيل الخروج وحذف جميع بيانات الحساب وكلمات المرور المحفوظة نهائياً؟")) return;
    
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem("alislamiah_current_user");
    
    alert("تم تسجيل الخروج وحذف البيانات بنجاح.");
    window.location.href = 'index.html';
  }

  function render() {
    const list = getSaved();
    const box = document.getElementById("list");

    if (list.length === 0) {
      box.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔐</div>
          <p>لا توجد كلمات مرور محفوظة بعد</p>
          <p style="font-size:13.5px;margin-top:8px;opacity:.8">
            عند تسجيل الدخول أو إنشاء حساب جديد في Gemalot، اضغط على "نعم، احفظها" لتظهر هنا تلقائياً.
          </p>
        </div>`;
      return;
    }

    box.innerHTML = list.map((item, index) => `
      <div class="card">
        <div class="card-header">
          <div>
            <h3>${escapeHtml(item.name || "مستخدم")}</h3>
            <div class="email">${escapeHtml(item.email || "")}</div>
            <div class="site">🌐 ${escapeHtml(item.site || "Gemalot")}</div>
          </div>
        </div>
        <div class="password-row">
          <span id="pass-${index}">••••••••</span>
          <button class="btn-show" onclick="togglePass(${index})">إظهار</button>
          <button class="btn-copy" onclick="copyPass(${index})">نسخ</button>
          <button class="btn-delete" onclick="deletePass(${index})">حذف</button>
        </div>
      </div>
    `).join("") + `
      <div class="actions-bottom">
        <button class="btn-clear" onclick="clearAll()">مسح الكل</button>
      </div>`;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function togglePass(index) {
    const list = getSaved();
    const el = document.getElementById("pass-" + index);
    const btn = el.nextElementSibling;
    if (!list[index]) return;

    if (el.textContent === "••••••••") {
      el.textContent = list[index].password;
      btn.textContent = "إخفاء";
    } else {
      el.textContent = "••••••••";
      btn.textContent = "إظهار";
    }
  }

  function copyPass(index) {
    const list = getSaved();
    if (!list[index]) return;
    navigator.clipboard.writeText(list[index].password).then(() => {
      alert("تم نسخ كلمة المرور بنجاح");
    }).catch(() => {
      alert("تعذر النسخ");
    });
  }

  function deletePass(index) {
    if (!confirm("هل تريد حذف كلمة المرور هذه؟")) return;
    const list = getSaved();
    list.splice(index, 1);
    setSaved(list);
    render();
  }

  function clearAll() {
    if (!confirm("هل أنت متأكد من مسح جميع كلمات المرور؟")) return;
    localStorage.removeItem(STORAGE_KEY);
    render();
  }

  render();
</script>
</body>
</html>
