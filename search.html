<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Search — Alislamiah AI</title>
<link rel="icon" href="icon.png">

<style>
*{box-sizing:border-box}

:root{
    --bg:#07111f;
    --panel:#0e1b2d;
    --panel2:#12243b;
    --border:rgba(130,170,220,.16);
    --text:#f4f7ff;
    --muted:#91a5c2;
    --accent:#2497f3;
}

body{
    margin:0;
    min-height:100vh;
    padding-bottom:85px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

button,input{font:inherit}

/* شريط البحث المثبت */
.topbar{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    background:rgba(7,17,31,.97);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
}

.back-button{
    width:38px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:white;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    text-decoration:none;
    font-size:23px;
}

#mainAiLogo{
    width:34px;
    height:38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

#mainAiLogo img{
    width:32px;
    height:32px;
    object-fit:contain;
}

.search-wrapper{
    position:relative;
    flex:1;
    min-width:0;
}

.search-box{
    position:relative;
    z-index:102;
    display:flex;
    align-items:center;
    gap:9px;
    height:46px;
    padding:0 10px;
    background:var(--panel);
    border:1px solid rgba(65,151,240,.35);
    border-radius:14px;
}

#searchInput{
    flex:1;
    width:100%;
    min-width:0;
    height:100%;
    color:white;
    background:transparent;
    border:0;
    outline:none;
    font-size:15px;
}

#searchInput::placeholder{color:var(--muted)}

.clear-button{
    display:none;
    width:27px;
    height:30px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:19px;
    cursor:pointer;
}

.search-button{
    width:34px;
    height:34px;
    flex-shrink:0;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-size:20px;
}

/* اقتراحات البحث */
.suggestions{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    z-index:101;
    display:none;
    overflow:hidden;
    background:#0c192b;
    border:1px solid rgba(100,155,220,.23);
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.suggestions.show{display:block}

.suggestion-heading{
    padding:12px 14px 8px;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.suggestion-item{
    display:flex;
    align-items:center;
    gap:11px;
    min-height:45px;
    padding:10px 14px;
    cursor:pointer;
    border-top:1px solid rgba(130,170,220,.08);
}

.suggestion-item:hover,
.suggestion-item:focus{
    outline:none;
    background:#142944;
}

.suggestion-icon{
    width:29px;
    height:29px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#172a43;
    border-radius:9px;
    color:#80caff;
}

.suggestion-text{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
}

.suggestion-arrow{
    color:var(--muted);
    font-size:17px;
}

.suggestion-empty{
    padding:16px;
    color:var(--muted);
    font-size:13px;
}

/* خلفية عند فتح الاقتراحات */
.suggestion-backdrop{
    position:fixed;
    inset:0;
    z-index:90;
    display:none;
    background:rgba(0,0,0,.2);
}

.suggestion-backdrop.show{display:block}

/* سجل البحث */
.content{
    width:min(800px,100%);
    margin:auto;
    padding:20px 15px;
}

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.section-heading h2{
    margin:0;
    font-size:17px;
}

.section-heading a{
    color:#58baff;
    text-decoration:none;
    font-size:13px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:13px;
    min-height:63px;
    padding:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    cursor:pointer;
}

.history-icon{
    width:39px;
    height:39px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel2);
    border-radius:11px;
    color:#b9d9ff;
    overflow:hidden;
}

.history-icon img{
    width:26px;
    height:26px;
    object-fit:contain;
}

.history-info{
    flex:1;
    min-width:0;
}

.history-title{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
}

.history-time{
    display:block;
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
}

.empty-state{
    padding:25px 15px;
    text-align:center;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    font-size:14px;
}

/* القائمة السفلية */
.bottom-nav{
    position:fixed;
    z-index:120;
    bottom:0;
    left:0;
    right:0;
    min-height:67px;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(7,17,31,.98);
    border-top:1px solid var(--border);
}

.nav-item{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:var(--muted);
    text-decoration:none;
    font-size:10px;
}

.nav-item.active{color:#47b7ff}

.nav-icon{
    width:25px;
    height:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.nav-icon img{
    width:25px;
    height:25px;
    object-fit:contain;
}

@media(min-width:700px){
    .topbar{
        padding-left:max(18px,calc((100% - 800px)/2));
        padding-right:max(18px,calc((100% - 800px)/2));
    }
}
</style>
</head>

<body>

<div class="suggestion-backdrop" id="suggestionBackdrop"></div>

<header class="topbar">
    <a class="back-button" href="index.html" aria-label="Home">‹</a>

    <div id="mainAiLogo">
        <img src="icon.png" alt="Alislamiah AI">
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <input
                id="searchInput"
                type="search"
                placeholder="Search..."
                autocomplete="off"
                aria-label="Search"
                aria-controls="suggestions"
                aria-expanded="false">

            <button
                class="clear-button"
                id="clearButton"
                type="button"
                aria-label="Clear search">×</button>

            <button
                class="search-button"
                id="searchButton"
                type="button"
                aria-label="Search">⌕</button>
        </div>

        <div class="suggestions" id="suggestions" role="listbox"></div>
    </div>
</header>

<main class="content">
    <div class="section-heading">
        <h2>Recent searches</h2>
        <a href="history.html">View all history</a>
    </div>

    <div class="history-list" id="historyList"></div>
</main>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
    </a>

    <a class="nav-item active" href="search.html">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
    </a>

    <a class="nav-item" href="chat.html">
        <span class="nav-icon">
            <img src="icon.pdf" alt="Alislamiah AI">
        </span>
        <span>Alislamiah AI</span>
    </a>

    <a class="nav-item" href="Settings.html">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
    </a>
</nav>

<script>
const RESULTS_PAGE = "results.html";
const HISTORY_KEY = "alislamiah_history";
const SUGGESTIONS_KEY = "alislamiah_search_suggestions";

const searchInput = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");
const clearButton = document.getElementById("clearButton");
const backdrop = document.getElementById("suggestionBackdrop");

/* =========================================
   تحديث شعار محرك البحث من الإعدادات
========================================= */

function updateMainAiLogo() {
    const engine = localStorage.getItem("searchEngine") || "Alislamiah AI";
    const logoContainer = document.getElementById("mainAiLogo");

    if (!logoContainer) return;

    if (engine === "Alislamiah AI") {
        logoContainer.innerHTML = '<img src="icon.png" alt="Alislamiah AI">';
    } else if (engine === "Alislamiah") {
        logoContainer.innerHTML = '<img src="icon.jpg" alt="Alislamiah">';
    } else if (engine === "Google") {
        logoContainer.innerHTML = '<img src="https://www.google.com/favicon.ico" alt="Google" style="width:70px;height:70px;object-fit:contain;">';
    } else if (engine === "Microsoft Bing") {
        logoContainer.innerHTML = '<img src="https://www.bing.com/sa/simg/favicon-2x.ico" alt="Microsoft Bing" style="width:70px;height:70px;object-fit:contain;">';
    }
}

window.addEventListener("load", updateMainAiLogo);

window.addEventListener("storage", function(event) {
    if (event.key === "searchEngine") {
        updateMainAiLogo();
    }
});

/* =========================================
   سجل البحث
البنية متوافقة مع history.html
========================================= */

function getHistory(){
    try{
        const data = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(data) ? data : [];
    }catch(error){
        return [];
    }
}

function addToHistory(name, targetUrl, icon){
    let history = getHistory();

    history = history.filter(item => item.url !== targetUrl);

    history.unshift({
        title: name,
        url: targetUrl,
        time: Date.now(),
        icon: icon
    });

    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

/* =========================================
   حفظ كلمات البحث السابقة للاقتراحات
========================================= */

function getSavedSuggestions(){
    try{
        const data = JSON.parse(localStorage.getItem(SUGGESTIONS_KEY) || "[]");
        return Array.isArray(data) ? data : [];
    }catch(error){
        return [];
    }
}

function saveSuggestion(query){
    const value = query.trim();
    if(!value) return;

    let items = getSavedSuggestions();

    items = items.filter(item =>
        String(item).toLocaleLowerCase() !== value.toLocaleLowerCase()
    );

    items.unshift(value);

    localStorage.setItem(
        SUGGESTIONS_KEY,
        JSON.stringify(items.slice(0,50))
    );
}

/* =========================================
   إظهار الاقتراحات أثناء الكتابة
========================================= */

function showSuggestions(){
    const query = searchInput.value.trim();
    clearButton.style.display = query ? "block" : "none";

    if(!query){
        hideSuggestions();
        return;
    }

    const normalizedQuery = query.toLocaleLowerCase();

    const historyMatches = getHistory()
        .map(item => item.title)
        .filter(title =>
            typeof title === "string" &&
            title.toLocaleLowerCase().includes(normalizedQuery)
        );

    const savedMatches = getSavedSuggestions()
        .filter(title =>
            title.toLocaleLowerCase().includes(normalizedQuery)
        );

    const matches = [];
    const seen = new Set();

    [...historyMatches, ...savedMatches, query].forEach(value => {
        const text = String(value).trim();
        const key = text.toLocaleLowerCase();

        if(text && !seen.has(key)){
            seen.add(key);
            matches.push(text);
        }
    });

    const visibleMatches = matches.slice(0,8);

    suggestionsBox.innerHTML = "";

    const heading = document.createElement("div");
    heading.className = "suggestion-heading";
    heading.textContent = "Search suggestions";
    suggestionsBox.appendChild(heading);

    visibleMatches.forEach((text, index) => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.setAttribute("role", "option");
        item.setAttribute("tabindex", "0");

        const icon = document.createElement("div");
        icon.className = "suggestion-icon";
        icon.textContent = index < historyMatches.length ? "◷" : "⌕";

        const label = document.createElement("div");
        label.className = "suggestion-text";
        label.textContent = text;

        const arrow = document.createElement("div");
        arrow.className = "suggestion-arrow";
        arrow.textContent = "↵";

        item.appendChild(icon);
        item.appendChild(label);
        item.appendChild(arrow);

        item.addEventListener("mousedown", function(event){
            event.preventDefault();
        });

        item.addEventListener("click", function(){
            searchInput.value = text;
            performSearch();
        });

        item.addEventListener("keydown", function(event){
            if(event.key === "Enter"){
                event.preventDefault();
                searchInput.value = text;
                performSearch();
            }
        });

        suggestionsBox.appendChild(item);
    });

    suggestionsBox.classList.add("show");
    backdrop.classList.add("show");
    searchInput.setAttribute("aria-expanded", "true");
}

function hideSuggestions(){
    suggestionsBox.classList.remove("show");
    backdrop.classList.remove("show");
    searchInput.setAttribute("aria-expanded", "false");
}

searchInput.addEventListener("input", showSuggestions);
searchInput.addEventListener("focus", function(){
    if(searchInput.value.trim()) showSuggestions();
});

clearButton.addEventListener("click", function(){
    searchInput.value = "";
    clearButton.style.display = "none";
    hideSuggestions();
    searchInput.focus();
});

backdrop.addEventListener("click", hideSuggestions);

document.addEventListener("click", function(event){
    if(!event.target.closest(".search-wrapper")){
        hideSuggestions();
    }
});

/* =========================================
   تنفيذ البحث
========================================= */

function searchShortcut(name, icon){
    const targetUrl = RESULTS_PAGE + "?q=" + encodeURIComponent(name);

    addToHistory(name, targetUrl, icon);
    saveSuggestion(name);

    window.location.href = targetUrl;
}

function performSearch(){
    const query = searchInput.value.trim();

    if(query === ""){
        searchInput.focus();
        return;
    }

    const targetUrl = RESULTS_PAGE + "?q=" + encodeURIComponent(query);
    const engine = localStorage.getItem("searchEngine") || "Alislamiah AI";

    let histIcon = "icon.png";

    if(engine === "Google"){
        histIcon = "https://www.google.com/favicon.ico";
    }else if(engine === "Microsoft Bing"){
        histIcon = "https://www.bing.com/favicon.ico";
    }else if(engine === "Alislamiah"){
        histIcon = "icon.jpg";
    }

    addToHistory(query, targetUrl, histIcon);
    saveSuggestion(query);
    hideSuggestions();

    window.location.href = targetUrl;
}

function handleSearchKey(event){
    if(event.key === "Enter"){
        event.preventDefault();
        performSearch();
    }

    if(event.key === "Escape"){
        hideSuggestions();
    }
}

document.getElementById("searchButton").addEventListener("click", performSearch);

/* =========================================
   عرض آخر 10 عمليات بحث
========================================= */

function renderHistory(){
    const container = document.getElementById("historyList");
    if(!container) return;

    const history = getHistory().slice(0,10);

    if(history.length === 0){
        container.innerHTML =
            '<div class="empty-state">No recent searches yet.</div>';
        return;
    }

    container.innerHTML = "";

    history.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";

        const iconBox = document.createElement("div");
        iconBox.className = "history-icon";

        const iconValue = item.icon || "⌕";

        if(typeof iconValue === "string" &&
           (iconValue.startsWith("http://") ||
            iconValue.startsWith("https://") ||
            iconValue.endsWith(".png") ||
            iconValue.endsWith(".jpg"))){

            const img = document.createElement("img");
            img.src = iconValue;
            img.alt = "";
            iconBox.appendChild(img);
        }else{
            iconBox.textContent = iconValue;
        }

        const info = document.createElement("div");
        info.className = "history-info";

        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = item.title || "Search";

        const time = document.createElement("span");
        time.className = "history-time";
        time.textContent = item.time
            ? new Date(item.time).toLocaleString()
            : "";

        info.appendChild(title);
        info.appendChild(time);

        row.appendChild(iconBox);
        row.appendChild(info);

        row.addEventListener("click", function(){
            if(item.url) window.location.href = item.url;
        });

        container.appendChild(row);
    });
}

/* =========================================
   الحماية
========================================= */

(function(){
    const currentUser = localStorage.getItem("alislamiah_current_user");

    if(!currentUser){
        window.location.replace("signin.html");
    }
})();

/* =========================================
   نظام اللغة الموحد
========================================= */

function getLanguage(){
    return localStorage.getItem("appLanguage") || "en";
}

function applyLanguage(lang){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
}

document.addEventListener("DOMContentLoaded", function(){
    applyLanguage(getLanguage());
    renderHistory();
});

window.addEventListener("storage", function(event){
    if(event.key === "appLanguage"){
        applyLanguage(event.newValue || "en");
    }

    if(event.key === HISTORY_KEY || event.key === SUGGESTIONS_KEY){
        renderHistory();

        if(searchInput.value.trim()){
            showSuggestions();
        }
    }
});

window.addEventListener("pageshow", function(){
    updateMainAiLogo();
    renderHistory();
});
</script>

</body>
</html>
