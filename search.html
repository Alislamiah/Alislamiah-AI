<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<title>Alislamiah AI Search</title>
<link rel="icon" href="icon.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #050b18;
    --panel: #0b1629;
    --panel2: #101f36;
    --blue: #398cff;
    --cyan: #39d5e9;
    --text: #f4f7ff;
    --muted: #8192ad;
    --border: rgba(111,157,225,.16);
}

body {
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% -10%, #163968 0%, transparent 48%),
        linear-gradient(145deg, #050b18, #071326 60%, #040914);
    padding-bottom: 100px;
}

/* =================================
   WELCOME SCREEN
================================= */

.welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 5000;
    background:
        radial-gradient(circle at center, #142e55 0%, #08162c 42%, #040914 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity .65s ease, visibility .65s ease;
}

.welcome-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-logo {
    width: 112px;
    height: 112px;
    object-fit: contain;
    border-radius: 29px;
    filter: drop-shadow(0 0 35px rgba(54,143,255,.32));
    animation: logoEnter 1s ease both;
}

.welcome-line {
    width: 75px;
    height: 3px;
    margin-top: 32px;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,.1);
}

.welcome-line::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    border-radius: 20px;
    animation: loading 1.4s ease-in-out infinite;
}

@keyframes logoEnter {
    from {
        opacity: 0;
        transform: scale(.75);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes loading {
    from { transform: translateX(-120%); }
    to { transform: translateX(250%); }
}

/* =================================
   PAGE CONTENT
================================= */

#pageContent {
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease;
}

#pageContent.ready {
    opacity: 1;
    visibility: visible;
}

/* HEADER */

.header {
    height: 70px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(5,12,26,.55);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 17px;
    font-weight: bold;
}

.brand img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 10px;
}

.engine-name {
    color: #9ab0d0;
    font-size: 12px;
}

/* MAIN */

.container {
    width: 92%;
    max-width: 780px;
    margin: auto;
}

/* HERO */

.hero {
    text-align: center;
    padding: 57px 10px 29px;
}

.hero h1 {
    font-size: clamp(27px, 5vw, 39px);
    letter-spacing: -.7px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #fff, #8fc6ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

/* =================================
   SEARCH BAR
================================= */

.search-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 0;
    background: rgba(5,11,24,.94);
    backdrop-filter: blur(18px);
}

.search-box {
    min-height: 65px;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 8px 13px 8px 9px;
    border-radius: 19px;
    background: linear-gradient(135deg, #11233e, #0a172b);
    border: 1px solid rgba(72,145,255,.27);
    box-shadow: 0 12px 38px rgba(0,0,0,.23);
    transition: .25s;
}

.search-box:focus-within {
    border-color: #398cff;
    box-shadow: 0 0 0 3px rgba(57,140,255,.1);
}

.engine-logo {
    width: 37px;
    height: 37px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 10px;
    background: rgba(255,255,255,.04);
    padding: 3px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    height: 45px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}

.search-box input::placeholder {
    color: #8294ad;
}

.search-submit {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #398cff, #2465d5);
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(40,112,220,.2);
}

/* =================================
   ENGINE SHORTCUTS
================================= */

.engine-section {
    margin-top: 24px;
}

.engine-heading {
    color: #a9bad3;
    font-size: 13px;
    margin-bottom: 13px;
}

.engine-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
}

.engine-card {
    min-height: 91px;
    padding: 13px 5px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(145deg, #102039, #0a1629);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: .2s;
}

.engine-card:hover {
    border-color: rgba(65,147,255,.5);
    background: #122642;
}

.engine-card:active {
    transform: scale(.96);
}

.engine-card img {
    width: 29px;
    height: 29px;
    object-fit: contain;
}

.engine-card span {
    font-size: 11px;
    color: #c8d6eb;
    text-align: center;
}

/* =================================
   RECENT SEARCHES
================================= */

.history-section {
    margin-top: 37px;
}

.history-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.history-heading h2 {
    font-size: 17px;
    font-weight: 600;
}

.view-history {
    color: #72adff;
    text-decoration: none;
    font-size: 12px;
    padding: 8px 11px;
    background: rgba(57,140,255,.09);
    border: 1px solid rgba(57,140,255,.2);
    border-radius: 10px;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.history-item {
    min-height: 63px;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    gap: 13px;
    background: linear-gradient(110deg, #0d1a2e, #0a1526);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: .2s;
}

.history-item:active {
    background: #142840;
}

.history-icon {
    width: 37px;
    height: 37px;
    flex-shrink: 0;
    object-fit: contain;
    padding: 5px;
    border-radius: 11px;
    background: #14243a;
}

.history-query {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #e5edf9;
    font-size: 13px;
}

.empty-history {
    padding: 27px 15px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: 15px;
    background: rgba(11,22,41,.5);
}

/* =================================
   BOTTOM NAVIGATION
================================= */

.bottom-nav {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    min-height: 72px;
    padding: 9px 5px calc(9px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(5,12,29,.97);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(18px);
    z-index: 1000;
}

.nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    color: #8495b0;
    font-size: 11px;
    font-weight: 600;
    transition: .2s;
}

.nav-item.active {
    color: #55a6ff;
}

.nav-icon {
    font-size: 22px;
    line-height: 24px;
}

.nav-item img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 7px;
}

/* =================================
   MOBILE
================================= */

@media(max-width:480px) {
    .header {
        height: 64px;
        padding: 0 15px;
    }

    .hero {
        padding-top: 43px;
    }

    .engine-list {
        gap: 8px;
    }

    .engine-card {
        min-height: 83px;
        border-radius: 13px;
    }

    .search-box {
        min-height: 59px;
    }
}
</style>
</head>

<body>

<!-- WELCOME SCREEN: icon.png ONLY -->

<div class="welcome-screen" id="welcomeScreen">
    <img src="icon.png" class="welcome-logo" alt="Alislamiah">
    <div class="welcome-line"></div>
</div>

<div id="pageContent">

    <header class="header">
        <div class="brand">
            <img id="topLogo" src="icon.png" alt="Alislamiah">
            <span>Alislamiah</span>
        </div>

        <span class="engine-name" id="engineName">Alislamiah AI</span>
    </header>

    <main class="container">

        <section class="hero">
            <h1>Alislamiah Search</h1>
            <p>اكتشف العالم، وابحث بطريقة أذكى</p>
        </section>

        <!-- SEARCH -->

        <section class="search-sticky">
            <form class="search-box" id="searchForm">

                <img
                    src="icon.png"
                    class="engine-logo"
                    id="searchLogo"
                    alt="Search engine"
                >

                <input
                    type="search"
                    id="searchInput"
                    placeholder="ابحث في Alislamiah..."
                    autocomplete="off"
                    required
                >

                <button class="search-submit" type="submit">
                    ⌕
                </button>

            </form>
        </section>

        <!-- SEARCH ENGINES -->

        <section class="engine-section">

            <div class="engine-heading">
                محركات البحث
            </div>

            <div class="engine-list">

                <button class="engine-card"
                    onclick="selectEngine('Alislamiah AI')">
                    <img src="icon.png" alt="">
                    <span>Alislamiah AI</span>
                </button>

                <button class="engine-card"
                    onclick="selectEngine('Alislamiah')">
                    <img src="icon.jpg" alt=""
                         onerror="this.src='icon.png'">
                    <span>Alislamiah</span>
                </button>

                <button class="engine-card"
                    onclick="selectEngine('Google')">
                    <img src="https://www.google.com/favicon.ico" alt="">
                    <span>Google</span>
                </button>

                <button class="engine-card"
                    onclick="selectEngine('Microsoft Bing')">
                    <img src="https://www.bing.com/sa/simg/favicon-2x.ico" alt="">
                    <span>Microsoft Bing</span>
                </button>

            </div>
        </section>

        <!-- RECENT HISTORY -->

        <section class="history-section">

            <div class="history-heading">
                <h2>عمليات البحث الأخيرة</h2>
                <a href="history.html" class="view-history">
                    عرض السجل الكامل
                </a>
            </div>

            <div class="history-list" id="historyList">
                <div class="empty-history">
                    لا توجد عمليات بحث حديثة
                </div>
            </div>

        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="search.html" class="nav-item active">
            <span class="nav-icon">⌕</span>
            <span>search</span>
        </a>

        <a href="chat.html" class="nav-item">
            <img src="icon.png" alt="">
            <span>Alislamiah AI</span>
        </a>

        <a href="Settings.html" class="nav-item">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
        </a>

    </nav>

</div>

<script>

/* =====================================
   CONFIGURATION
===================================== */

const RESULTS_PAGE = "results.html";
const HISTORY_KEY = "alislamiah_history";

/* =====================================
   WELCOME SCREEN
===================================== */

window.addEventListener("load", function() {

    setTimeout(function() {

        document.getElementById("welcomeScreen")
            .classList.add("hide");

        document.getElementById("pageContent")
            .classList.add("ready");

        updateMainAiLogo();

        renderHistory();

    }, 1900);

});

/* =====================================
   SEARCH ENGINE SETTINGS
===================================== */

function getEngine() {
    return localStorage.getItem("searchEngine") || "Alislamiah AI";
}

function getEngineLogo(engine) {

    const logos = {
        "Alislamiah AI": "icon.png",
        "Alislamiah": "icon.jpg",
        "Google": "https://www.google.com/favicon.ico",
        "Microsoft Bing": "https://www.bing.com/sa/simg/favicon-2x.ico"
    };

    return logos[engine] || "icon.png";
}

function updateMainAiLogo() {

    const engine = getEngine();
    const logo = getEngineLogo(engine);

    document.getElementById("topLogo").src = logo;
    document.getElementById("searchLogo").src = logo;
    document.getElementById("engineName").textContent = engine;

}

/* =====================================
   SELECT SEARCH ENGINE
===================================== */

function selectEngine(engine) {

    localStorage.setItem("searchEngine", engine);

    updateMainAiLogo();

}

/* =====================================
   USER PROTECTION
===================================== */

function checkUser() {

    const user = localStorage.getItem("alislamiah_current_user");

    if (!user) {
        window.location.href = "signin.html";
        return false;
    }

    return true;

}

/* =====================================
   HISTORY STORAGE
   Compatible with history.html
===================================== */

function getHistory() {

    try {

        const data = localStorage.getItem(HISTORY_KEY);

        if (!data) return [];

        const history = JSON.parse(data);

        return Array.isArray(history) ? history : [];

    } catch(error) {

        return [];

    }

}

function saveHistory(history) {

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );

}

/* =====================================
   ADD SEARCH TO FULL HISTORY
===================================== */

function addToHistory(name, targetUrl, icon) {

    const history = getHistory();

    history.unshift({

        title: name,

        url: targetUrl,

        time: Date.now(),

        icon: icon || getEngineLogo(getEngine())

    });

    saveHistory(history);

    renderHistory();

}

/* =====================================
   DISPLAY LAST 10 ONLY
===================================== */

function renderHistory() {

    const container = document.getElementById("historyList");

    if (!container) return;

    const history = getHistory();

    const recent = history.slice(0, 10);

    container.innerHTML = "";

    if (recent.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-history";
        empty.textContent = "لا توجد عمليات بحث حديثة";

        container.appendChild(empty);

        return;

    }

    recent.forEach(function(item) {

        const row = document.createElement("div");

        row.className = "history-item";

        const img = document.createElement("img");

        img.className = "history-icon";
        img.src = item.icon || "icon.png";
        img.alt = "";

        img.onerror = function() {
            this.src = "icon.png";
        };

        const title = document.createElement("div");

        title.className = "history-query";
        title.textContent = item.title || "Untitled";

        row.appendChild(img);
        row.appendChild(title);

        row.addEventListener("click", function() {

            if (item.url) {
                window.location.href = item.url;
            }

        });

        container.appendChild(row);

    });

}

/* =====================================
   PERFORM SEARCH
===================================== */

function performSearch() {

    if (!checkUser()) return;

    const input = document.getElementById("searchInput");

    const query = input.value.trim();

    if (!query) return;

    const targetUrl =
        RESULTS_PAGE + "?q=" + encodeURIComponent(query);

    addToHistory(
        query,
        targetUrl,
        getEngineLogo(getEngine())
    );

    window.location.href = targetUrl;

}

/* =====================================
   SEARCH SHORTCUT
===================================== */

function searchShortcut(name, icon) {

    if (!checkUser()) return;

    const query = name.trim();

    if (!query) return;

    const targetUrl =
        RESULTS_PAGE + "?q=" + encodeURIComponent(query);

    addToHistory(
        query,
        targetUrl,
        icon || getEngineLogo(getEngine())
    );

    window.location.href = targetUrl;

}

/* =====================================
   KEYBOARD
===================================== */

function handleSearchKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        performSearch();

    }

}

document.getElementById("searchForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        performSearch();

    });

document.getElementById("searchInput")
    .addEventListener("keydown", handleSearchKey);

/* =====================================
   STORAGE SYNC
===================================== */

window.addEventListener("storage", function(event) {

    if (event.key === "searchEngine") {
        updateMainAiLogo();
    }

    if (event.key === HISTORY_KEY) {
        renderHistory();
    }

});

</script>

</body>
</html>
