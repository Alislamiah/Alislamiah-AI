<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah AI - Search</title>
<link rel="icon" href="icon.png">

<style>
*{box-sizing:border-box}

:root{
    --bg:#050b18;
    --panel:#0b172b;
    --panel2:#10213a;
    --blue:#1676e9;
    --cyan:#28c5e8;
    --text:#f4f8ff;
    --muted:#91a5c2;
    --border:rgba(130,170,220,.14);
}

body{
    margin:0;
    min-height:100vh;
    padding-bottom:90px;
    font-family:Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% 0%,rgba(24,92,180,.2),transparent 40%),
      linear-gradient(145deg,#050b18,#071225 55%,#030813);
}

button,input{font:inherit}

/* Welcome screen */
#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050b18;
    transition:.5s;
}

#welcomeScreen.hide{
    opacity:0;
    visibility:hidden;
}

#welcomeScreen img{
    width:105px;
    height:105px;
    object-fit:contain;
}

#pageContent{display:none}
#pageContent.show{display:block}

/* Header */
.top-header{
    height:66px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:rgba(5,11,24,.9);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:17px;
    font-weight:bold;
}

.brand img{
    width:36px;
    height:36px;
    object-fit:contain;
    border-radius:10px;
}

.menu-button{
    width:42px;
    height:42px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--panel);
    color:white;
    font-size:23px;
    cursor:pointer;
}

/* Main */
.container{
    width:min(850px,100%);
    margin:auto;
    padding:28px 17px;
}

.hero{
    text-align:center;
    padding:25px 10px;
}

.main-ai-logo{
    width:90px;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 19px;
    border-radius:27px;
    background:linear-gradient(145deg,#102b50,#09172b);
    border:1px solid rgba(74,158,255,.2);
    box-shadow:0 12px 40px rgba(0,0,0,.3);
}

.main-ai-logo img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.hero h1{
    margin:0;
    font-size:30px;
}

.hero p{
    color:var(--muted);
    margin:12px 0 0;
    font-size:14px;
}

/* Sticky search */
.search-area{
    position:sticky;
    top:0;
    z-index:50;
    padding:12px 0;
    background:rgba(5,11,24,.95);
    backdrop-filter:blur(15px);
}

.search-box{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:60px;
    padding:8px 13px;
    background:linear-gradient(145deg,#10213b,#0a172a);
    border:1px solid rgba(85,151,220,.24);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.search-logo{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.search-logo img{
    width:30px;
    height:30px;
    object-fit:contain;
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    color:white;
    background:transparent;
    font-size:16px;
}

.search-box input::placeholder{color:#8296b3}

.search-submit{
    width:43px;
    height:43px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#1676e9,#19b7d8);
    color:white;
    font-size:23px;
    cursor:pointer;
}

/* Engine information */
.engine-card{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:20px;
    padding:16px;
    background:linear-gradient(135deg,#0e1d34,#0a1425);
    border:1px solid var(--border);
    border-radius:17px;
}

.engine-logo{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#132744;
}

.engine-logo img{
    width:34px;
    height:34px;
    object-fit:contain;
}

.engine-info strong{
    display:block;
    font-size:15px;
}

.engine-info span{
    display:block;
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

/* Shortcuts */
.shortcuts{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:27px;
}

.shortcut{
    text-align:center;
    padding:15px 5px;
    background:linear-gradient(145deg,#10213a,#0a1526);
    border:1px solid var(--border);
    border-radius:16px;
    cursor:pointer;
}

.shortcut-icon{
    width:43px;
    height:43px;
    margin:0 auto 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:#173153;
    font-size:21px;
}

.shortcut span{
    font-size:12px;
    color:#dceaff;
}

/* History */
.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:32px 2px 15px;
}

.section-title h2{
    font-size:17px;
    margin:0;
}

.section-title a{
    color:#4cb9ef;
    text-decoration:none;
    font-size:13px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px;
    background:linear-gradient(135deg,#0d1b30,#091526);
    border:1px solid var(--border);
    border-radius:15px;
    cursor:pointer;
}

.history-icon{
    width:39px;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#142743;
    border-radius:12px;
    flex-shrink:0;
}

.history-icon img{
    width:25px;
    height:25px;
    object-fit:contain;
}

.history-text{
    flex:1;
    min-width:0;
}

.history-text strong{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
}

.history-text span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.empty-history{
    text-align:center;
    padding:28px 12px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    font-size:13px;
}

/* Bottom navigation */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:100;
    display:flex;
    justify-content:space-around;
    align-items:center;
    height:70px;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(5,12,25,.97);
    border-top:1px solid var(--border);
    backdrop-filter:blur(15px);
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#8fa3c0;
    text-decoration:none;
    font-size:10px;
    min-width:55px;
}

.nav-icon{
    width:25px;
    height:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.nav-icon img{
    width:25px;
    height:25px;
    object-fit:contain;
}

.nav-item.active{color:#42c4ed}

/* Menu */
.menu-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.65);
    opacity:0;
    visibility:hidden;
    transition:.25s;
}

.menu-overlay.show{
    opacity:1;
    visibility:visible;
}

.menu-panel{
    position:absolute;
    top:0;
    bottom:0;
    right:0;
    width:min(300px,85%);
    padding:25px 18px;
    background:#091629;
    border-left:1px solid var(--border);
    transform:translateX(100%);
    transition:.25s;
}

[dir="rtl"] .menu-panel{
    right:auto;
    left:0;
    transform:translateX(-100%);
    border-left:0;
    border-right:1px solid var(--border);
}

.menu-overlay.show .menu-panel{transform:translateX(0)}

.menu-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
    font-weight:bold;
}

.menu-close{
    border:0;
    color:white;
    background:transparent;
    font-size:25px;
    cursor:pointer;
}

.menu-link{
    display:block;
    padding:15px;
    margin-bottom:9px;
    color:#e5efff;
    text-decoration:none;
    background:#10213a;
    border:1px solid var(--border);
    border-radius:13px;
}

@media(max-width:480px){
    .container{padding:20px 14px}
    .hero h1{font-size:25px}
    .shortcuts{gap:8px}
    .shortcut{padding:12px 3px}
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <img src="icon.png" alt="Alislamiah">
</div>

<div id="pageContent">

<header class="top-header">
    <div class="brand">
        <img src="icon.png" alt="Alislamiah">
        <span>Alislamiah</span>
    </div>
    <button class="menu-button" onclick="openMenu()">☰</button>
</header>

<main class="container">

    <section class="hero">
        <div class="main-ai-logo" id="mainAiLogo"></div>
        <h1>Alislamiah Search</h1>
        <p>Discover the world with Alislamiah</p>
    </section>

    <div class="search-area">
        <div class="search-box">
            <div class="search-logo" id="searchLogo"></div>
            <input
                type="search"
                id="searchInput"
                placeholder="Search Alislamiah..."
                onkeydown="handleSearchKey(event)"
                autocomplete="off">
            <button class="search-submit" onclick="performSearch()">⌕</button>
        </div>
    </div>

    <div class="engine-card">
        <div class="engine-logo" id="selectedEngineLogo"></div>
        <div class="engine-info">
            <strong id="selectedEngineName">Alislamiah AI</strong>
            <span>Search engine selected from Settings</span>
        </div>
    </div>

    <div class="shortcuts">
        <div class="shortcut" onclick="searchShortcut('Quran','📖')">
            <div class="shortcut-icon">📖</div>
            <span>Quran</span>
        </div>

        <div class="shortcut" onclick="searchShortcut('Islamic','☪️')">
            <div class="shortcut-icon">☪️</div>
            <span>Islamic</span>
        </div>

        <div class="shortcut" onclick="searchShortcut('News','📰')">
            <div class="shortcut-icon">📰</div>
            <span>News</span>
        </div>

        <div class="shortcut" onclick="searchShortcut('Technology','💻')">
            <div class="shortcut-icon">💻</div>
            <span>Technology</span>
        </div>
    </div>

    <div class="section-title">
        <h2>Recent searches</h2>
        <a href="history.html">View all</a>
    </div>

    <div class="history-list" id="historyList"></div>

</main>

<nav class="bottom-nav">

    <a class="nav-item" href="index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
    </a>

    <a class="nav-item active" href="search.html">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
    </a>

    <a class="nav-item" href="chat.html">
        <span class="nav-icon">
            <img src="icon.pdf" alt="Alislamiah AI">
        </span>
        <span>Alislamiah AI</span>
    </a>

    <a class="nav-item" href="Settings.html">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
    </a>

</nav>

</div>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu(event)">
    <div class="menu-panel">

        <div class="menu-heading">
            <span>Alislamiah Menu</span>
            <button class="menu-close" onclick="closeMenu()">×</button>
        </div>

        <a class="menu-link" href="index.html">Home</a>
        <a class="menu-link" href="search.html">Search</a>
        <a class="menu-link" href="history.html">Search History</a>
        <a class="menu-link" href="chat.html">Alislamiah AI</a>
        <a class="menu-link" href="Settings.html">Settings</a>

    </div>
</div>

<script>

/* =========================================
   إعدادات الصفحة
========================================= */

const RESULTS_PAGE = "results.html";
const HISTORY_KEY = "alislamiah_history";

/* =========================================
   تحديث أيقونة AI حسب محرك البحث
========================================= */

function updateMainAiLogo() {
    const engine = localStorage.getItem("searchEngine") || "Alislamiah AI";
    const logoContainer = document.getElementById("mainAiLogo");

    if (!logoContainer) return;

    if (engine === "Alislamiah AI") {
        logoContainer.innerHTML = '<img src="icon.png" alt="Alislamiah AI">';
    } else if (engine === "Alislamiah") {
        logoContainer.innerHTML = '<img src="icon.jpg" alt="Alislamiah">';
    } else if (engine === "Google") {
        logoContainer.innerHTML = '<img src="https://www.google.com/favicon.ico" alt="Google" style="width:70px; height:70px; object-fit:contain;">';
    } else if (engine === "Microsoft Bing") {
        logoContainer.innerHTML = '<img src="https://www.bing.com/sa/simg/favicon-2x.ico" alt="Microsoft Bing" style="width:70px; height:70px; object-fit:contain;">';
    }

    const searchLogo = document.getElementById("searchLogo");
    const selectedEngineLogo = document.getElementById("selectedEngineLogo");
    const selectedEngineName = document.getElementById("selectedEngineName");

    if (searchLogo) {
        searchLogo.innerHTML = logoContainer.innerHTML;
    }

    if (selectedEngineLogo) {
        selectedEngineLogo.innerHTML = logoContainer.innerHTML;
    }

    if (selectedEngineName) {
        selectedEngineName.textContent = engine;
    }
}

window.addEventListener("load", function() {
    updateMainAiLogo();
});

window.addEventListener("storage", function(event) {
    if (event.key === "searchEngine") {
        updateMainAiLogo();
    }
});

/* =========================================
   نظام سجل البحث
========================================= */

function getHistory(){
    try{
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    }catch(error){
        return [];
    }
}

function saveHistory(history){
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function addToHistory(name, targetUrl, icon){
    let history = getHistory();

    history = history.filter(item => item.url !== targetUrl);

    history.unshift({
        title: name,
        url: targetUrl,
        time: Date.now(),
        icon: icon
    });

    saveHistory(history);
}

function renderHistory(){
    const historyList = document.getElementById("historyList");
    if(!historyList) return;

    const history = getHistory().slice(0,10);

    if(history.length === 0){
        historyList.innerHTML =
            '<div class="empty-history">No recent searches yet</div>';
        return;
    }

    historyList.innerHTML = "";

    history.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";

        const iconBox = document.createElement("div");
        iconBox.className = "history-icon";

        if(item.icon && (
            item.icon.startsWith("http") ||
            item.icon.endsWith(".png") ||
            item.icon.endsWith(".jpg")
        )){
            const img = document.createElement("img");
            img.src = item.icon;
            img.alt = "";
            iconBox.appendChild(img);
        }else{
            iconBox.textContent = item.icon || "⌕";
        }

        const textBox = document.createElement("div");
        textBox.className = "history-text";

        const title = document.createElement("strong");
        title.textContent = item.title || "Search";

        const time = document.createElement("span");
        time.textContent = item.time
            ? new Date(item.time).toLocaleString()
            : "";

        textBox.appendChild(title);
        textBox.appendChild(time);

        row.appendChild(iconBox);
        row.appendChild(textBox);

        row.addEventListener("click", function(){
            if(item.url) window.location.href = item.url;
        });

        historyList.appendChild(row);
    });
}

/* =========================================
   البحث والاختصارات
========================================= */

function searchShortcut(name, icon){
    const targetUrl = RESULTS_PAGE + "?q=" + encodeURIComponent(name);
    addToHistory(name, targetUrl, icon);
    window.location.href = targetUrl;
}

function performSearch(){
    const input = document.getElementById("searchInput");
    const query = input.value.trim();

    if(query === ""){
        input.focus();
        return;
    }

    const targetUrl = RESULTS_PAGE + "?q=" + encodeURIComponent(query);
    const engine = localStorage.getItem("searchEngine") || "Alislamiah AI";

    let histIcon = "icon.png";

    if (engine === "Google") histIcon = "https://www.google.com/favicon.ico";
    else if (engine === "Microsoft Bing") histIcon = "https://www.bing.com/favicon.ico";
    else if (engine === "Alislamiah") histIcon = "icon.jpg";

    addToHistory(query, targetUrl, histIcon);

    window.location.href = targetUrl;
}

function handleSearchKey(event){
    if(event.key === "Enter"){
        event.preventDefault();
        performSearch();
    }
}

/* =========================================
   القائمة الجانبية
========================================= */

function openMenu(){
    const overlay = document.getElementById("menuOverlay");
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
}

function closeMenu(event){
    const overlay = document.getElementById("menuOverlay");

    if(event && event.target !== overlay) return;

    overlay.classList.remove("show");
    document.body.style.overflow = "";
}

document.addEventListener("keydown", function(event){
    if(event.key === "Escape"){
        document.getElementById("menuOverlay").classList.remove("show");
        document.body.style.overflow = "";
    }
});

/* =========================================
   كود الحماية
========================================= */

(function () {
    const currentUser = localStorage.getItem("alislamiah_current_user");

    if (!currentUser) {
        window.location.href = "signin.html";
    }
})();

/* =========================================
   نظام اللغة الموحد - Alislamiah
========================================= */

function getLanguage() {
    return localStorage.getItem("appLanguage") || "en";
}

function applyLanguage(lang) {
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
}

document.addEventListener("DOMContentLoaded", function () {
    applyLanguage(getLanguage());
    renderHistory();
});

window.addEventListener("storage", function (e) {
    if (e.key === "appLanguage") {
        applyLanguage(e.newValue || "en");
    }

    if (e.key === HISTORY_KEY) {
        renderHistory();
    }
});

/* تحديث عند الرجوع للصفحة */
window.addEventListener("pageshow", function(){
    updateMainAiLogo();
    renderHistory();
});

/* شاشة الترحيب */
window.addEventListener("load", function(){
    setTimeout(function(){
        document.getElementById("welcomeScreen").classList.add("hide");
        document.getElementById("pageContent").classList.add("show");
    }, 1500);
});

</script>

</body>
</html>
